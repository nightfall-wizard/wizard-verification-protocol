[package]
name = "wvp-release-check"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "WVP release integrity reference checker bootstrap"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[[test]]
name = "security_negative_fixtures"
path = "tests/security_negative_fixtures.rs"
