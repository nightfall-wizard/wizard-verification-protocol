name: AUNEYA v1.1 evidence federation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: openssl version

      - name: Federation and legacy conformance
        run: |
          python3 -m unittest discover \
            -s tests \
            -p 'test_auneya_federation_v11.py' -v

          python3 -m unittest discover \
            -s tests \
            -p 'test_auneya_archive_v10.py' -v

          python3 -m unittest discover \
            -s tests \
            -p 'test_auneya_archive_v09.py' -v

          python3 -m unittest discover \
            -s tests \
            -p 'test_auneya_wvp_evidence_batch_v08.py' -v
