name: AUNEYA v1.19 Adversarial Dual Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adversarial-dual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine Ed25519 adversarial differential tests
        run: python3 -m unittest discover -s tests -p 'test_auneya_gate4_adversarial_v119.py' -v
      - name: Existing v1.18 baseline regression
        run: python3 -m unittest discover -s tests -p 'test_auneya_gate4_bundle_v118.py' -v
      - name: Deterministic README evidence check
        run: python3 tools/readme_truth.py --check
