name: AUNEYA v1.6 authenticated peer gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-gate-v16:

    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and adversarial crypto/replay tests
        run: |
          node --check tools/auneya/auneya_peer_crypto_v16.js

          python3 -m py_compile \
            tools/auneya/auneya_peer_gate_v16.py

          python3 -m unittest discover \
            -s tests \
            -p 'test_auneya_peer_gate_v16.py' \
            -v
