name: AUNEYA v1.7 bounded transport

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-v17:

    name: transport-v17

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and adversarial loopback verification
        run: |
          python3 -m py_compile \
            tools/auneya/auneya_transport_v17.py

          python3 -m unittest discover \
            -s tests \
            -p 'test_auneya_transport_v17.py' \
            -v
