name: AUNEYA v1.20 Wire Research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wire-v120:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_auneya_wire_v120.py' -v
      - run: python3 tools/readme_truth.py --check
