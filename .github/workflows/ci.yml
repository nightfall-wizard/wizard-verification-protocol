name: WVP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust reference implementations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Example JSON output
        run: cargo run --manifest-path reference/rust/wvp-release-check/Cargo.toml -- --target nightfall-wizard/wizard-verification-protocol --json

      - name: Release-check conformance smoke
        run: ./conformance/release-check-smoke.sh

      - name: Release-check live GitHub metadata smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./conformance/release-check-live-smoke.sh

      - name: WVP self-release checksum conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./conformance/release-check-self-release-checksum.sh

      - name: WVP missing signature policy conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./conformance/release-check-missing-signature-policy.sh

      - name: WVP no-secret signing material conformance
        run: ./conformance/release-check-no-secret-signing-material.sh

      - name: WVP signature tooling capability conformance
        run: ./conformance/release-check-signature-tooling-capability.sh

      - name: WVP signature status model conformance
        run: ./conformance/release-check-signature-status-model.sh

      - name: WVP public release verification key conformance
        run: ./conformance/release-check-public-key-policy.sh

      - name: WVP self-release signature conformance
        run: ./conformance/release-check-self-release-signature.sh
        env:
          GH_REPO: ${{ github.repository }}

      - name: WVP signature asset matching conformance
        run: ./conformance/release-check-signature-asset-matching.sh

      - name: WVP signature tamper-negative conformance
        run: ./conformance/release-check-signature-tamper-negative.sh

      - name: WVP v0.2 release candidate docs conformance
        run: ./conformance/release-check-v02-rc-docs.sh

      - name: WVP v0.2 version and build script conformance
        run: ./conformance/release-check-v02-version-build-script.sh

      - name: WVP v0.2.0 post-release conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./conformance/release-check-v020-post-release.sh

      - name: WVP reproducible-build evidence baseline conformance
        run: ./conformance/release-check-reproducible-build-evidence-baseline.sh

      - name: WVP same-environment repeat-build conformance
        run: ./conformance/release-check-same-env-repeat-build.sh

      - name: WVP independent-environment separation conformance
        run: ./conformance/release-check-independent-environment-separation.sh

      - name: WVP CI build provenance artifact conformance
        run: ./conformance/release-check-ci-build-provenance-artifact.sh

      - name: WVP CI build provenance artifact generation
        run: ./scripts/release/generate-ci-build-provenance-artifact.sh --require-clean

      - name: Upload WVP CI build provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: wvp-ci-build-provenance-${{ github.sha }}
          path: target/wvp-ci-build-provenance
          if-no-files-found: error

      - name: WVP v0.3 release readiness checklist conformance
        run: ./conformance/release-check-v030-readiness-checklist.sh


      - name: WVP v0.3 release docs conformance
        run: ./conformance/release-check-v030-release-docs.sh

      - name: WVP v0.3 version/release plan conformance
        run: ./conformance/release-check-v030-version-release-plan.sh
      - name: WVP Android-vs-CI local conformance script syntax
        run: bash -n ./conformance/release-check-android-vs-ci-build-provenance.sh

      - name: WVP build provenance comparison format conformance
        run: ./conformance/release-check-build-provenance-comparison-format.sh

