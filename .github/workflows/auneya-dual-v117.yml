name: AUNEYA v1.17 Dual Runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dual-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_auneya_dual_v117.py' -v
      - run: python3 tools/readme_truth.py --check
